[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oeis-formula-discovery"
version = "0.1.0"
description = "A Fully Local, Deterministic Mathematical Discovery Engine for OEIS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rajveersinh Pardeshi" }]
dependencies = [
    "sympy>=1.12",
    "mpmath>=1.3.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-socket>=0.6.0",
    "flake8>=6.1.0",
    "black>=23.7.0",
    "mypy>=1.5.0",
]

[project.scripts]
oeis-discovery = "src.cli:main"
